[project]
name = "citadel-reproducibility-environment"
version = "0.1.0"
description = "Pinned numerical environment for the CITADEL research artifact"
readme = "README.md"
requires-python = "==3.11.15"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "certifi==2025.8.3",
  "scikit-learn==1.6.1",
  "scipy==1.17.1",
  "matplotlib==3.10.8",
  "networkx==3.4.2",
  "psutil==7.0.0",
  "jupyterlab==4.3.4",
  "ipykernel==6.29.5",
  "nbformat==5.10.4",
  "nbclient==0.11.0",
  "threadpoolctl==3.6.0",
]

[tool.uv]
package = false
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
