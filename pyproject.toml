[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exact-tcad"
version = "0.1.0"
description = "EXACT-TCAD: reproducible journal-extension workspace for edge causal telemetry and CINTAS RTL studies"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
  {name = "EXACT authors", email = "replace-me@example.com"},
]
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "matplotlib==3.10.8",
  "networkx==3.4.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
]
notebook = [
  "jupyterlab==4.3.4",
  "ipykernel==6.29.5",
  "nbformat==5.10.4",
]

[tool.setuptools.packages.find]
include = ["exact*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
